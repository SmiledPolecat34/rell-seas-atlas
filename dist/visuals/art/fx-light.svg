<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img"><style>.a{transform-box:fill-box;transform-origin:center}.pu{animation:pu 1.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.4)}}.ray{animation:rt 6s linear infinite;transform-origin:160px 90px}@keyframes rt{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10102a"/><stop offset="1" stop-color="#5a4a1a"/></linearGradient><radialGradient id="vig" cx="0.5" cy="0.5" r="0.75"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.5"/></radialGradient></defs><rect width="320" height="180" fill="url(#bg)"/><circle class="a pu" cx="160" cy="90" r="30" fill="#fff6c8"/><path class="a ray" transform="rotate(0 160 90)" d="M160 90 L150 -40 h20z" fill="#fff6c8" opacity=".5"/><path class="a ray" transform="rotate(30 160 90)" d="M160 90 L150 -40 h20z" fill="#fff6c8" opacity=".5"/><path class="a ray" transform="rotate(60 160 90)" d="M160 90 L150 -40 h20z" fill="#fff6c8" opacity=".5"/><path class="a ray" transform="rotate(90 160 90)" d="M160 90 L150 -40 h20z" fill="#fff6c8" opacity=".5"/><path class="a ray" transform="rotate(120 160 90)" d="M160 90 L150 -40 h20z" fill="#fff6c8" opacity=".5"/><path class="a ray" transform="rotate(150 160 90)" d="M160 90 L150 -40 h20z" fill="#fff6c8" opacity=".5"/><path class="a ray" transform="rotate(180 160 90)" d="M160 90 L150 -40 h20z" fill="#fff6c8" opacity=".5"/><path class="a ray" transform="rotate(210 160 90)" d="M160 90 L150 -40 h20z" fill="#fff6c8" opacity=".5"/><path class="a ray" transform="rotate(240 160 90)" d="M160 90 L150 -40 h20z" fill="#fff6c8" opacity=".5"/><path class="a ray" transform="rotate(270 160 90)" d="M160 90 L150 -40 h20z" fill="#fff6c8" opacity=".5"/><path class="a ray" transform="rotate(300 160 90)" d="M160 90 L150 -40 h20z" fill="#fff6c8" opacity=".5"/><path class="a ray" transform="rotate(330 160 90)" d="M160 90 L150 -40 h20z" fill="#fff6c8" opacity=".5"/><rect width="320" height="180" fill="url(#vig)"/></svg>