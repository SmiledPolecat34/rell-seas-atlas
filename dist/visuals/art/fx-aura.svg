<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img"><style>.a{transform-box:fill-box;transform-origin:center}.au{animation:au 2.2s ease-in-out infinite}@keyframes au{50%{transform:scale(1.3);opacity:.5}}.wing{animation:wg 1.8s ease-in-out infinite;transform-origin:160px 100px}.wing2{animation:wg2 1.8s ease-in-out infinite;transform-origin:160px 100px}@keyframes wg{50%{transform:rotate(-12deg)}}@keyframes wg2{50%{transform:rotate(12deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0a3a"/><stop offset="1" stop-color="#6a2a8a"/></linearGradient><radialGradient id="vig" cx="0.5" cy="0.5" r="0.75"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.5"/></radialGradient></defs><rect width="320" height="180" fill="url(#bg)"/><circle class="a au" cx="160" cy="95" r="60" fill="url(#ag)"/><path class="a wing" d="M160 100 q-100 -90 -140 -20 q50 -10 70 30 q-34 4 -50 36 q50 -20 120 -46z" fill="#ffd9a0" opacity=".85"/><path class="a wing2" d="M160 100 q100 -90 140 -20 q-50 -10 -70 30 q34 4 50 36 q-50 -20 -120 -46z" fill="#ffd9a0" opacity=".85"/><circle cx="160" cy="96" r="14" fill="#fff"/><rect width="320" height="180" fill="url(#vig)"/></svg>