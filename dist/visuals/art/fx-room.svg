<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img"><style>.a{transform-box:fill-box;transform-origin:center}.rm{animation:rm 2.4s ease-in-out infinite}@keyframes rm{0%{transform:scale(.2);opacity:0}30%{opacity:1}100%{transform:scale(1.1);opacity:1}}.sl2{stroke-dasharray:240;animation:sl2 2.4s ease-in-out infinite}@keyframes sl2{0%,50%{stroke-dashoffset:240}80%,100%{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06203a"/><stop offset="1" stop-color="#0a6aa0"/></linearGradient><radialGradient id="vig" cx="0.5" cy="0.5" r="0.75"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.5"/></radialGradient></defs><rect width="320" height="180" fill="url(#bg)"/><circle class="a rm" cx="160" cy="90" r="70" fill="#4cc9f0" fill-opacity=".14" stroke="#8fe3ff" stroke-width="2"/><ellipse cx="160" cy="90" rx="70" ry="22" fill="none" stroke="#8fe3ff" opacity=".6"/><ellipse cx="160" cy="90" rx="22" ry="70" fill="none" stroke="#8fe3ff" opacity=".6"/><path class="a sl2" d="M70 150 L250 30" stroke="#fff" stroke-width="3"/><rect width="320" height="180" fill="url(#vig)"/></svg>