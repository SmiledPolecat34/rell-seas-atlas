<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img"><style>.a{transform-box:fill-box;transform-origin:center}.ex{animation:ex 1.6s ease-out infinite}@keyframes ex{0%{transform:scale(.3);opacity:1}100%{transform:scale(7);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0a0a"/><stop offset="1" stop-color="#4a1a0a"/></linearGradient><radialGradient id="vig" cx="0.5" cy="0.5" r="0.75"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.5"/></radialGradient></defs><rect width="320" height="180" fill="url(#bg)"/><circle class="a ex" cx="160" cy="95" r="14" fill="#ffd166"/><circle class="a ex" style="animation-delay:.25s" cx="160" cy="95" r="14" fill="none" stroke="#ff7a2a" stroke-width="6"/><rect width="320" height="180" fill="url(#vig)"/></svg>