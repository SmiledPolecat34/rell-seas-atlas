<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img"><style>.a{transform-box:fill-box;transform-origin:center}.sm{animation:sm 4.5s ease-out infinite;opacity:0}@keyframes sm{0%{opacity:.7;transform:translateY(0) scale(.5)}100%{opacity:0;transform:translateY(-150px) scale(2.4)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a22"/><stop offset="1" stop-color="#4a4a5a"/></linearGradient><radialGradient id="vig" cx="0.5" cy="0.5" r="0.75"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.5"/></radialGradient></defs><rect width="320" height="180" fill="url(#bg)"/><circle class="a sm" style="animation-delay:0.00s" cx="80" cy="170" r="22" fill="#cfd4dc"/><circle class="a sm" style="animation-delay:0.50s" cx="100" cy="170" r="22" fill="#cfd4dc"/><circle class="a sm" style="animation-delay:1.00s" cx="120" cy="170" r="22" fill="#cfd4dc"/><circle class="a sm" style="animation-delay:1.50s" cx="140" cy="170" r="22" fill="#cfd4dc"/><circle class="a sm" style="animation-delay:2.00s" cx="160" cy="170" r="22" fill="#cfd4dc"/><circle class="a sm" style="animation-delay:2.50s" cx="180" cy="170" r="22" fill="#cfd4dc"/><circle class="a sm" style="animation-delay:3.00s" cx="200" cy="170" r="22" fill="#cfd4dc"/><circle class="a sm" style="animation-delay:3.50s" cx="220" cy="170" r="22" fill="#cfd4dc"/><circle class="a sm" style="animation-delay:4.00s" cx="240" cy="170" r="22" fill="#cfd4dc"/><rect width="320" height="180" fill="url(#vig)"/></svg>